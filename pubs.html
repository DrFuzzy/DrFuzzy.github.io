<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="js/bibtex_js.js" type="text/javascript" charset="utf-8"></script>
<bibtex src="bibtex/publications.bib"></bibtex>

<script>
$(function() {
  $("#Fontselector").on("change", function() {
    var font = $("#Fontselector option:selected").text();
    console.log(font);

    $('.title.fonters').each(function() {
      $(this).css("font-family", font);
    });
  });
});

function reset() {
  $("select").each(function () {
    localStorage.setItem($(this).attr("id"), "");
    $(this).val("");
  });
  $("#searchbar").val("");
  $("#searchbar").trigger('change');
}
</script>

<a name="top"></a>

<div class="pubs-wrapper">

<h1 class="pubs-title">Publications</h1>

<div class="pubs-search-container">
  <div class="searchbar">

    <button type="button" class="btn btn-default pubs-search-control" onclick="reset()">Reset</button>

    <select id="authorselectfirst"
        class="btn bibtex_search bibtex_generate_author pubs-search-control pubs-search-first-author"
        extra="first"
        search="author">
      <option value="">Search First Author</option>
    </select>

    <select id="authorselect"
            class="btn bibtex_search bibtex_generate_author pubs-search-control"
            search="author">
      <option value="">Search Author</option>
    </select>

    <input type="text"
           class="bibtex_search form-control pubs-search-box"
           id="searchbar"
           placeholder="Search publications">

  </div>
</div>
</div>

<div class="bibtex_structure">
    <div class="sort year" extra="DESC number">
            <div class="templates"></div>
    </div>
</div>

<h2> Refereed Articles </h2>
<div class="bibtex_display" bibtextypekey = ARTICLE></div>

<h2> Conferences </h2>
<div class="bibtex_display" bibtextypekey = INPROCEEDINGS></div>

<h2> Book sections </h2>
<div class="bibtex_display" bibtextypekey = INCOLLECTION></div>

<h2> Thesis </h2>
<div class="bibtex_display" bibtextypekey = THESIS></div>


<div class="bibtex_template">
    <span class="if year">
        <span class="year"></span>
        <a href="#top" style="display:inline"><em>(Top of the page)</em></a>
    </span>
    <ul> <li>
    <span style="text-decoration:underline;" class="title"></span>,
    <div class="if author">
        <span class="author"></span>
    </div>

<div>
    <span class="if journal"><em><span class="journal"></span></em>,</span>
    <span class="if publisher"><em><span class="publisher"></span></em>,</span>
    <span class="if booktitle">In <em><span class="booktitle"></span></em>,</span>
    <span class="if address"><span class="address"></span>,</span>
    <span class="if month"><span class="month"></span>,</span>
    <span class="if year"><span class="year"></span>.</span>
    <span class="if note"><span class="note"></span></span>
    <a class="bibtexVar" role="button" data-bs-toggle="collapse" href="#bib+BIBTEXKEY+" aria-expanded="false" aria-controls="bib+BIBTEXKEY+" extra="BIBTEXKEY" bibtexjs-css-escape> [bib]
    </a>
</div>

<div class="bibtexVar collapse" id="bib+BIBTEXKEY+" extra="BIBTEXKEY">
    <div class="well">
        <pre><span class="bibtexraw noread"></span></pre>
    </div>
</div>

<div style="display:none"><span class="bibtextype"></span></div>
</li></ul>

</div>
</div>
